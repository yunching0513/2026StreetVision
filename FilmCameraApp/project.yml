name: FilmCameraApp
options:
  bundleIdPrefix: com.example
targets:
  FilmCameraApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - FilmCameraApp
    info:
      path: FilmCameraApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "We need access to your camera to take film photos."
        NSPhotoLibraryUsageDescription: "We need access to read and save the filtered photos to your library."
        NSPhotoLibraryAddUsageDescription: "We need access to save the filtered photos to your library."
